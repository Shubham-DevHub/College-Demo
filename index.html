    <script>
      // Defensive handling for dev tools & iframe scripts attempting to set window.fetch
      try {
        if (typeof window !== 'undefined') {
          let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get() {
              return _fetch;
            },
            set(newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        // Fallback silently if environment prevents redefining
      }
    </script>
